<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="280" viewBox="0 0 1000 280"
     role="img"
     aria-label="A4.s03. Abdul Samad Babillail. Business Development, IT Infrastructure, Workflow Automation, and AI Tooling.">

  <title>A4.s03 — Abdul Samad Babillail</title>
  <desc>A minimal, premium-white professional header with a cobalt-blue signature stroke that draws once.</desc>

  <!-- Premium paper surface, with a quiet edge for dark-mode contrast -->
  <rect x="0.5" y="0.5" width="999" height="279" rx="16"
        fill="#FAFAF8" stroke="#E6E8ED"/>

  <!-- Brand signature and editorial folio -->
  <text x="55" y="51" font-family="Arial, Helvetica, sans-serif"
        font-size="19" font-weight="700" letter-spacing="0.1"
        fill="#2563EB">A4.s03</text>

  <text x="945" y="49" text-anchor="end"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11" letter-spacing="1.65"
        fill="#7D8490">ENGINEERING / PORTFOLIO</text>

  <line x1="55" y1="76" x2="945" y2="76"
        stroke="#DFE3E8" stroke-width="1"/>

  <!-- Primary identity: full professional name -->
  <text x="53" y="165" font-family="Georgia, 'Times New Roman', serif"
        font-size="60" font-weight="400" letter-spacing="-1.3"
        fill="#171A21">Abdul Samad Babillail.</text>

  <!-- Professional disciplines, written for clarity rather than repetition -->
  <text x="55" y="207" font-family="Arial, Helvetica, sans-serif"
        font-size="16.5" letter-spacing="0.15"
        fill="#667085">Business Development · IT Infrastructure · Workflow Automation · AI Tooling</text>

  <!-- Quiet rule and an original one-time signature flourish -->
  <line x1="55" y1="244" x2="945" y2="244"
        stroke="#E2E6ED" stroke-width="1.6"/>

  <path d="M55 244 C128 244, 170 245, 225 242 S340 239, 410 244"
        fill="none" stroke="#2563EB" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="370" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="370" to="0"
             dur="1.9s" fill="freeze"/>
  </path>
</svg>
